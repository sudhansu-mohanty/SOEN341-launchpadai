sonar.projectKey=sudhansu-mohanty_SOEN341-launchpadai
sonar.organization=sudhansu-mohanty
sonar.projectName=SOEN341-launchpadai

# Code to analyze
sonar.sources=frontend/src,backend,supabase
sonar.exclusions=**/node_modules/**,**/.next/**,**/*.test.ts,**/*.test.tsx

# Tests
sonar.tests=frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Test coverage from the CI Coverage step
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Only frontend/src/lib has unit tests (see coverage.include in frontend/vitest.config.ts),
# so coverage is only measured there. Pages, components and the Python backend are left out.
sonar.coverage.exclusions=frontend/src/app/**,frontend/src/components/**,frontend/src/context/**,frontend/src/types/**,frontend/src/*.ts,backend/**,supabase/**
